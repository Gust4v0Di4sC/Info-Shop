<main class="callback-page">
  <section class="callback-card">
    @if (errorMessage) {
      <h1>Login nao concluido</h1>
      <p>{{ errorMessage }}</p>
      <a routerLink="/home">Voltar para login</a>
    } @else {
      <h1>{{ actionTitle }}</h1>
      <p>{{ actionDescription }}</p>
    }
  </section>
</main>
