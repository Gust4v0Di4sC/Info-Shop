<section id="categorias" class="categories-section">
  <div class="section-container">
    <div class="section-head">
      <h1>Navegue por categoria</h1>
      <p>
        Encontre em poucos cliques o que voce precisa. Cada categoria mostra
        estoque real e prazo de entrega.
      </p>
    </div>

    <div class="categories-grid">
      @for (category of categories; track category.slug) {
        <a class="category-card" [routerLink]="['/catalogo', category.slug]">
          <span class="category-icon"><i [class]="category.icon"></i></span>
          <h2>{{ category.name }}</h2>
          <p>{{ category.count }} produtos</p>
        </a>
      }
    </div>
  </div>
</section>
