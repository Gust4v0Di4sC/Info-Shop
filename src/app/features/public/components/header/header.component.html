<header class="header">
  <div class="top-banner">
    <span><i class="fas fa-truck"></i> Frete gratis para compras acima de R$ 99,90</span>
  </div>

  <div class="main-header">
    <a class="brand" routerLink="/">
      <img
        [ngSrc]="themeService.publicLogoUrl()"
        width="180"
        height="60"
        sizes="180px"
        alt="InfoShop Logo"
        class="logo-image">
    </a>

    <nav class="navigation" aria-label="Navegacao principal">
      <a routerLink="/" fragment="inicio" class="nav-link">Inicio</a>
      <a routerLink="/" fragment="categorias" class="nav-link">Categorias</a>
      <a routerLink="/" fragment="produtos" class="nav-link">Produtos</a>
      <a routerLink="/" fragment="ofertas" class="nav-link">Ofertas</a>
      <a routerLink="/" fragment="contato" class="nav-link">Contato</a>
    </nav>

    <div class="header-actions">
      <form class="search-container" role="search" (ngSubmit)="submitSearch()">
        <i class="fas fa-search"></i>
        <input
          type="search"
          class="search-input"
          name="publicSearch"
          aria-label="Buscar produtos"
          placeholder="Buscar notebooks, celulares..."
          [(ngModel)]="searchTerm"
        >
        <button class="search-btn" type="submit" aria-label="Buscar">
          <i class="fas fa-arrow-right"></i>
        </button>
      </form>

      <div class="user-actions">
        <button class="icon-btn" (click)="goToProfile()" type="button" aria-label="Perfil">
          <i class="far fa-user"></i>
        </button>
        <button
          class="icon-btn cart-btn"
          (click)="goToCart()"
          type="button"
          [attr.aria-label]="cartCount > 0 ? 'Carrinho com ' + cartCount + ' itens' : 'Carrinho vazio'">
          <i class="fas fa-shopping-bag cart-top-icon"></i>
          @if (cartCount > 0) {
            <span class="cart-badge">{{ cartCount }}</span>
          }
        </button>
      </div>
    </div>
  </div>
</header>
