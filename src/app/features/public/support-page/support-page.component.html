<main class="support-page">
  <section class="support-layout">
    <nav class="support-nav" aria-label="Topicos de suporte">
      @for (supportTopic of topics; track supportTopic.slug) {
        <button
          type="button"
          (click)="selectTopic(supportTopic)"
          [class.active]="supportTopic.slug === topic.slug"
        >
          {{ supportTopic.title }}
        </button>
      }
    </nav>

    <article class="support-content">
      <p class="eyebrow">Suporte InfoShop</p>
      <h1>{{ topic.title }}</h1>
      <p class="summary">{{ topic.summary }}</p>

      <ul>
        @for (item of topic.items; track item) {
          <li>{{ item }}</li>
        }
      </ul>

      <a class="contact-action" routerLink="/catalogo">
        Ver catálogo
        <mat-icon aria-hidden="true">arrow_forward</mat-icon>
      </a>
    </article>
  </section>
</main>
