<mat-sidenav-container class="admin-shell">
  <mat-sidenav
    class="admin-sidebar"
    mode="side"
    opened
    fixedInViewport="true">
    <div
      class="sidebar-panel"
      [class.expanded]="isExpanded"
      (mouseenter)="expandSidebar()"
      (mouseleave)="collapseSidebar()">
      <button class="brand" type="button" routerLink="/" aria-label="Voltar para a loja">
        <img class="brand-icon" src="/icon.svg" alt="InfoShop">
        <img class="brand-logo" src="/Logo1.svg" alt="InfoShop Logo">
      </button>

      <mat-nav-list class="nav-list">
        @for (item of navItems; track item.route) {
          <a
            mat-list-item
            class="nav-link"
            [routerLink]="item.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.route === '/dash' }">
            <span class="nav-link-content">
              <mat-icon>{{ item.icon }}</mat-icon>
              <span class="nav-label">{{ item.label }}</span>
            </span>
          </a>
        }
      </mat-nav-list>

      <div class="sidebar-footer">
        <button class="logout-button" type="button" mat-stroked-button (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Sair</span>
        </button>
      </div>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="admin-content">
    <router-outlet
      #outlet="outlet"
      [animate.enter]="'nav-animation-enter'"
      [animate.leave]="'nav-animation-leave'">
    </router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
