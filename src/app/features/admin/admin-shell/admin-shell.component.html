<mat-sidenav-container
  class="admin-shell admin-theme"
  [class.admin-theme-corporate]="themeService.currentThemeId() === 'corporate'"
  [class.admin-theme-graphite]="themeService.currentThemeId() === 'graphite'"
  [class.admin-theme-emerald]="themeService.currentThemeId() === 'emerald'">
  <mat-sidenav
    class="admin-sidebar"
    mode="side"
    opened
    fixedInViewport="true">
    <div
      class="sidebar-panel"
      [class.expanded]="isExpanded"
      (mouseenter)="expandSidebar()"
      (mouseleave)="collapseSidebar()">
      <button class="brand" type="button" routerLink="/" aria-label="Voltar para a loja">
        <img class="brand-icon" [src]="themeService.adminIconUrl()" alt="InfoShop">
        <img class="brand-logo" [src]="themeService.adminLogoUrl()" alt="InfoShop Logo">
      </button>

      <mat-nav-list class="nav-list">
        @for (item of visibleNavItems(); track item.route) {
          <a
            mat-list-item
            class="nav-link"
            [routerLink]="item.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.route === '/dash' }">
            <span class="nav-link-content">
              <mat-icon>{{ item.icon }}</mat-icon>
              <span class="nav-label">{{ item.label }}</span>
            </span>
          </a>
        }
      </mat-nav-list>

      <div class="sidebar-footer">
        @if (canSwitchStores()) {
          <mat-form-field class="store-select" appearance="outline">
            <mat-label>Loja atual</mat-label>
            <mat-select
              [value]="selectedStoreId"
              (selectionChange)="selectStore($event.value)"
              aria-label="Selecionar loja atual">
              @for (store of stores; track store.id) {
                <mat-option [value]="store.id">
                  {{ store.name }} - {{ store.region }}
                </mat-option>
              }
            </mat-select>
          </mat-form-field>
        } @else {
          <div class="store-chip">
            <mat-icon>storefront</mat-icon>
            <span>{{ selectedStoreLabel() }}</span>
          </div>
        }
        <div class="role-chip">
          <mat-icon>admin_panel_settings</mat-icon>
          <span>{{ roleLabel() }}</span>
        </div>
        <button class="logout-button" type="button" mat-stroked-button (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Sair</span>
        </button>
      </div>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="admin-content" appGsapPageMotion appGsapInteractiveMotion>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
