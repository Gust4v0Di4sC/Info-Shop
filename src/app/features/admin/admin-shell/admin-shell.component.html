<mat-sidenav-container
  class="admin-shell admin-theme"
  [class.admin-theme-corporate]="themeService.currentThemeId() === 'corporate'"
  [class.admin-theme-graphite]="themeService.currentThemeId() === 'graphite'"
  [class.admin-theme-emerald]="themeService.currentThemeId() === 'emerald'">
  <mat-sidenav
    class="admin-sidebar"
    mode="side"
    opened
    fixedInViewport="true">
    <div class="sidebar-panel">
      <button class="brand" type="button" aria-label="Voltar para o inicio administrativo" (click)="goToAdminHome()">
        <img class="brand-icon" [src]="themeService.adminIconUrl()" alt="InfoShop">
        <img class="brand-logo" [src]="themeService.adminLogoUrl()" alt="InfoShop Logo">
      </button>

      <mat-nav-list class="nav-list">
        @for (item of visibleNavItems(); track item.label) {
          <a
            mat-list-item
            class="nav-link"
            [routerLink]="navItemRoute(item)"
            [class.active]="isNavItemActive(item)"
            (click)="collapseSidebar()">
            <span class="nav-link-content">
              <mat-icon>{{ item.icon }}</mat-icon>
              <span class="nav-label">{{ item.label }}</span>
            </span>
          </a>
        }
      </mat-nav-list>

      <div class="sidebar-footer">
        <button class="logout-button" type="button" mat-stroked-button (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Sair</span>
        </button>
      </div>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="admin-content" appGsapPageMotion appGsapInteractiveMotion>
    <router-outlet></router-outlet>
  </mat-sidenav-content>

</mat-sidenav-container>

<div class="admin-topbar">
  <button
    class="profile-badge"
    type="button"
    [matMenuTriggerFor]="storeMenu"
    [attr.aria-label]="canSwitchStores() ? 'Selecionar loja atual' : 'Loja atual'">
    <span class="profile-avatar">{{ userInitials() }}</span>
    <span class="profile-copy">
      <strong>{{ adminName }}</strong>
      <small>{{ roleLabel() }}</small>
      <em>{{ selectedStoreLabel() }}</em>
    </span>
    @if (canSwitchStores()) {
      <mat-icon>expand_more</mat-icon>
    }
  </button>

  <mat-menu #storeMenu="matMenu" xPosition="before" class="store-menu">
    @for (store of stores; track store.id) {
      <button mat-menu-item type="button" (click)="selectStore(store.id)">
        <mat-icon>{{ store.id === selectedStoreId ? 'check_circle' : 'storefront' }}</mat-icon>
        <span>{{ store.name }} - {{ store.region }}</span>
      </button>
    }
  </mat-menu>
</div>
